aid: aivita-biomedical
name: AiVita Biomedical
description: AIVITA Biomedical is a biotechnology company developing personalized vaccines for the prevention of infectious diseases and treatment
  of cancer. It uses an autologous cell platform to create multi‑pathogen vaccine kits and novel cancer immunotherapies, leveraging stem‑cell
  technology for safe, efficient manufacturing. The company was founded in 2016 and focuses on personalized medicine, with programs in cancer,
  infectious disease, vision loss, and skincare.
